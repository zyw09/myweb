(function scratch() {
  const cvs = $('#scratch'), ctx = cvs.getContext('2d');
  const textEl = $('#scratchText');
  const msg = CONFIG.whispers[0].replace('这句话只说一次：', '');
  textEl.textContent = msg;

  let dpr = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0, drawing = false, revealed = false;

  function setup() {
    const r = cvs.getBoundingClientRect();
    W = r.width; H = r.height;
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 涂层
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#b79af0');
    g.addColorStop(.45, '#f06ea5');
    g.addColorStop(1, '#9b7cf0');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // 亮片
    for (let i = 0; i < 160; i++) {
      ctx.fillStyle = `rgba(255,255,255,${rand(.18, .6)})`;
      ctx.beginPath();
      ctx.arc(rand(0, W), rand(0, H), rand(.4, 1.4), 0, 6.2832);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.font = '500 13px "PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('刮开我', W / 2, H / 2 + 5);
  }

  function pos(e) {
    const r = cvs.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX - r.left, t.clientY - r.top];
  }

  function rub(x, y) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, 6.2832);
    ctx.fill();
  }

  let checkCount = 0;
  function checkProgress() {
    if (revealed) return;
    if (++checkCount % 12) return;
    const data = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
    let clear = 0, totalPx = 0;
    for (let i = 3; i < data.length; i += 4 * 24) {
      totalPx++;
      if (data[i] < 40) clear++;
    }
    if (clear / totalPx > 0.68) {
      revealed = true;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillRect(0, 0, W, H);
      $('#scratchHint').textContent = '看到了吧';
      $('#s7Next').classList.remove('hidden');
      Fireworks.celebrate(3);
    }
  }

  cvs.addEventListener('pointerdown', e => {
    drawing = true; cvs.setPointerCapture(e.pointerId);
    const [x, y] = pos(e); rub(x, y);
  });
  cvs.addEventListener('pointermove', e => {
    if (!drawing) return;
    const [x, y] = pos(e); rub(x, y); checkProgress();
  });
  cvs.addEventListener('pointerup', () => { drawing = false; checkProgress(); });
  cvs.addEventListener('pointercancel', () => { drawing = false; });

  window.setupScratch = () => { if (W === 0) setup(); };
  addEventListener('resize', () => { if (!revealed && W) setup(); }, { passive: true });
})();

/* ═══════════════════ 13. 会长大的玫瑰 ═══════════════════ */
(function rose() {
  const svg = $('#rose');
  const NS = 'http://www.w3.org/2000/svg';
  const TOTAL = 9;
  const CX = 150, CY = 140, D = Math.PI / 180;
  const LIGHT_A = -2.36;                       /* 光从左上来，和参考图一致 */
  const f = v => (+v).toFixed(2);
  let n = 0;

  /* ── 花瓣几何：绕花心的一段扇形，外缘鼓出、内缘回收，两端收成尖角 ── */
  function petalPath(p) {
    const K = 88, a0 = p.am - p.span * D / 2, a1 = p.am + p.span * D / 2;
    const outer = [], inner = [];
    for (let k = 0; k <= K; k++) {
      const u = k / K, a = a0 + (a1 - a0) * u;
      const w = 1 - Math.abs(2 * u - 1);        /* 中间 1、两端 0，端点处尖 */
      const w2 = Math.pow(w, .52);              /* 小于 1 → 两侧内凹，瓣尖更利 */
      const ro = p.R + p.h * w2 * (1 + p.flip * w);
      const ri = p.R - p.h * p.droop * Math.pow(w, .80);
      outer.push([CX + ro * Math.cos(a), CY + ro * Math.sin(a)]);
      inner.push([CX + ri * Math.cos(a), CY + ri * Math.sin(a)]);
    }
    return 'M ' + outer.map(q => f(q[0]) + ',' + f(q[1])).join(' L ') +
      ' L ' + inner.slice().reverse().map(q => f(q[0]) + ',' + f(q[1])).join(' L ') + ' Z';
  }

  /* 44 片螺旋绕排（黄金角 137.508°），外圈先画、内圈压在上面 —— 就是玫瑰的叠压顺序 */
  const N = 30, PETALS = [];
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const j = Math.sin(i * 2.71 + 1.1), j2 = Math.sin(i * 1.37 + 2.4), j3 = Math.sin(i * .83 + .6);
    PETALS.push({
      i, t,
      am: i * 137.508 * D,
      R: (7 + 84 * Math.pow(t, .86)) * (1 + j * .055 + j3 * .032),
      h: (12 + 30 * Math.pow(t, .76)) * (1 + j2 * .10),
      span: (150 - 74 * t) * (1 + j * .06) * (1 - .13 * t * t),
      flip: .10 + .34 * t,
      droop: .30 + .62 * t
    });
  }
  PETALS.sort((a, b) => b.R - a.R);

  /* 花心：一小团还没展开的卷瓣，压在最后把中心的洞堵住 */
  const CORES = [[1.4, 3.4, 347], [4.0, 3.8, 268], [7.2, 4.4, 216], [10.8, 5.0, 188]];

  /* 每片花瓣一套自己的渐变：朝向光的更亮，背光的更暗 → 不是平涂 */
  function petalGrad(id, p, bright) {
    const x1 = CX + (p.R + p.h) * Math.cos(p.am), y1 = CY + (p.R + p.h) * Math.sin(p.am);
    const x2 = CX + (p.R - p.h * .4) * Math.cos(p.am), y2 = CY + (p.R - p.h * .4) * Math.sin(p.am);
    return `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}">
      <stop offset="0" stop-color="${bright.rim}"/>
      <stop offset=".55" stop-color="${bright.mid}"/>
      <stop offset="1" stop-color="${bright.base}"/></linearGradient>`;
  }

  svg.innerHTML = `
    <defs>
      <linearGradient id="stemG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3f7d59"/><stop offset="1" stop-color="#123524"/>
      </linearGradient>
      <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4a8b60"/><stop offset="1" stop-color="#173d2b"/>
      </linearGradient>
      <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="${CX + 18}" cy="${CY + 22}" r="118">
        <stop offset="0" stop-color="#3a0009" stop-opacity=".42"/>
        <stop offset=".55" stop-color="#3a0009" stop-opacity=".14"/>
        <stop offset="1" stop-color="#3a0009" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="coreBase" gradientUnits="userSpaceOnUse" cx="${CX - 1}" cy="${CY - 1}" r="15">
        <stop offset="0" stop-color="#5e0a15"/><stop offset=".62" stop-color="#4a0710"/>
        <stop offset="1" stop-color="#4a0710" stop-opacity="0"/>
      </radialGradient>
      <filter id="pshadow" x="-30%" y="-30%" width="170%" height="170%">
        <feDropShadow dx="0" dy="1.6" stdDeviation="1.5" flood-color="#2a0004" flood-opacity=".55"/>
      </filter>
    </defs>
    <ellipse cx="${CX}" cy="382" rx="44" ry="5" fill="#8a4a6e" opacity=".13"/>
    <path d="M${CX} 386 C ${CX - 7} 320, ${CX + 7} 230, ${CX} 176" stroke="url(#stemG)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M${CX - 1} 350 C ${CX - 48} 340, ${CX - 84} 302, ${CX - 94} 258 C ${CX - 44} 270, ${CX - 13} 306, ${CX - 1} 344 Z" fill="url(#leafG)"/>
    <path d="M${CX + 1} 300 C ${CX + 48} 290, ${CX + 84} 252, ${CX + 94} 208 C ${CX + 44} 220, ${CX + 13} 256, ${CX + 1} 294 Z" fill="url(#leafG)" opacity=".94"/>
    <path d="M${CX - 2} 348 C ${CX - 32} 338, ${CX - 58} 310, ${CX - 72} 274" stroke="#0f2c1b" stroke-width="1" fill="none" opacity=".42"/>
    <path d="M${CX + 2} 298 C ${CX + 32} 288, ${CX + 58} 260, ${CX + 72} 224" stroke="#0f2c1b" stroke-width="1" fill="none" opacity=".36"/>
    <circle id="roseCore" cx="${CX}" cy="${CY}" r="16" fill="#3d0207" style="opacity:0;transition:opacity .55s ease"/>
    <g id="rosePetals"></g>
    <circle id="roseCoreTop" cx="${CX}" cy="${CY}" r="15" fill="url(#coreBase)" style="opacity:0;transition:opacity .55s ease"/>
    <circle id="roseVig" cx="${CX}" cy="${CY}" r="118" fill="url(#vig)" style="mix-blend-mode:multiply;opacity:0;transition:opacity .8s ease"/>`;

  const layer = $('#rosePetals');
  const words = $('#roseWords');

  /* 生成一片花瓣（带渐变 + 投影），返回 <g>，供逐片动画挂 */
  function makePetal(p, bright, id) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'petal');
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', petalPath(p));
    path.setAttribute('fill', `url(#${id})`);
    path.setAttribute('filter', 'url(#pshadow)');
    g.appendChild(path);
    return g;
  }

  /* ── 预建 ------------------------------------------------------------------
     DOM 顺序 = 叠压顺序：先画外圈（在下面），再画内圈（压在上面），
     最后画花心（永远最上）。全部初始 opacity:0，只等点击点亮。
  ------------------------------------------------------------------------- */
  const defsEl = svg.querySelector('defs');
  const ALL = [];        /* DOM 顺序（外 → 内） */

  function build(p, isCore, key) {
    const light = Math.max(0, Math.cos(p.am + LIGHT_A));
    const id = 'rp' + key;
    const bright = isCore
      ? { rim: '#a5152a', mid: '#7c0a17', base: '#3d0207' }
      : {
          rim: `hsl(351 78% ${(28 + 27 * light).toFixed(1)}%)`,
          mid: `hsl(348 84% ${(14 + 18 * light).toFixed(1)}%)`,
          base: `hsl(345 88% ${(6 + 8 * light).toFixed(1)}%)`
        };
    const tmp = document.createElementNS(NS, 'g');
    tmp.innerHTML = petalGrad(id, p, bright);
    defsEl.appendChild(tmp.firstElementChild);

    const g = makePetal(p, bright, id);
    g.style.opacity = '0';
    g.style.transformBox = 'view-box';
    g.style.transformOrigin = `${CX}px ${CY}px`;
    g.style.transform = 'scale(.30)';
    layer.appendChild(g);
    ALL.push(g);
    return g;
  }

  PETALS.forEach((p, i) => build(p, false, 'o' + i));                       /* 外 → 内 */
  const CORE_P = CORES.map((c, k) => ({                                     /* 花心最后画，最上 */
    am: (k * 137.5 + 18) * D, R: c[0], h: c[1], span: c[2], flip: .05, droop: .46
  }));
  CORE_P.forEach((p, k) => build(p, true, 'c' + k));

  /* 生长顺序 = 反向：花心先开，一层层往外推 —— 玫瑰就是这么开的 */
  const GROW = ALL.slice().reverse();

  const BATCH = Math.ceil(GROW.length / TOTAL);
  let qIdx = 0;

  /* 点亮下一批：从中心「推」到最终位置，一片接一片 */
  function bloomNext() {
    const from = qIdx, to = Math.min(GROW.length, qIdx + BATCH);
    qIdx = to;
    const els = GROW.slice(from, to);
    els.forEach((el, i) => {
      el.animate([
        { opacity: 0, transform: 'scale(.30)' },
        { opacity: 1, transform: 'scale(1.10)', offset: .70 },
        { opacity: 1, transform: 'scale(1)' }
      ], {
        duration: 640,
        delay: i * 110,
        easing: 'cubic-bezier(.20,.90,.26,1.04)',
        fill: 'forwards'
      });
    });
    return els;
  }

  const hints = [
    '从花心开始。',
    '一圈，一圈。',
    '卷起来了。',
    '外面开始张开。',
    '慢慢来。',
    '这是我认真准备的。',
    '一瓣，又一瓣。',
    '快开了。',
    ''
  ];

  svg.addEventListener('click', () => {
    if (n >= TOTAL) return;
    const els = bloomNext();

    if (n === 0) {
      $('#roseCore').style.opacity = '1';
      $('#roseCoreTop').style.opacity = '1';
    }

    n++;
    $('#roseCount').textContent = n + ' / ' + TOTAL;
    words.textContent = hints[n - 1] || '';

    if (n >= TOTAL) {
      const done = els.length * 110 + 640;
      setTimeout(() => {
        $('#roseVig').style.opacity = '1';
        words.innerHTML = '<span style="font-size:18px">它开满了。<br>但我对你的喜欢，没满。</span>';
        $('#s8Next').classList.remove('hidden');
      }, done - 140);
      setTimeout(() => Fireworks.celebrate(5), done + 220);
    }
  });

  svg.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); svg.click(); }
  });
})();

/* ═══════════════════ 14. 收尾 & 保存成信 ═══════════════════ */
(function ending() {
  /* —— 最后的逐字打字 —— */
  let typed = false;

        setTimeout(() => {
          caret.remove();
          // 还原成整段纯文本：inline-block 逐字会让「，」跑到行首
          box.textContent = chars.join('');
        }, 900);

      }
      const ch = chars[i++];
      const sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = ch;
      box.insertBefore(sp, caret);
      let delay = 185;
      if (/[，。！；：、]/.test(ch)) delay = 660;
      else if (/[,.!;:]/.test(ch)) delay = 480;
      setTimeout(step, reduceMotion ? 0 : delay);
    }
    setTimeout(step, 520);
  };

  /* ---- 机缘四题 ---- */
  (function fate() {
    const box = $('#fate');
    if (!box) return;
    const Q = CONFIG.fate || [];
    const badge = $('#fateBadge'), qEl = $('#fateQ'), input = $('#fateInput');
    const msg = $('#fateMsg'), dots = $('#fateDots'), pop = $('#fatePop');
    const popTitle = $('#fatePopTitle'), popText = $('#fatePopText');
    const popEmoji = $('#fateEmoji'), voice = $('#fateVoice'), voiceLabel = $('#fateVoiceLabel');
    const tip = $('#fateTip'), next = $('#fateNext');
    let idx = 0;

    const norm = v => String(v == null ? '' : v).normalize('NFKC').toLowerCase()
      .replace(/\s+/g, '').replace(/[\p{P}\p{S}]/gu, '');
    const isRight = (list, v) => {
      const n = norm(v);
      if (!n) return false;
      return list.some(a => norm(a) === n);
    };
    const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };

    function paintDots(done) {
      dots.innerHTML = '';
      for (let i = 0; i < Q.length; i++) {
        const d = document.createElement('span');
        d.className = 'pdot' + (done || i < idx ? ' done' : (i === idx ? ' on' : ''));
        dots.appendChild(d);
      }
    }

    function render() {
      const it = Q[idx] || {};
      badge.textContent = `第 ${idx + 1} 题 · 共 ${Q.length} 题`;
      qEl.textContent = it.q || '';
      input.value = '';
      msg.textContent = '';
      msg.classList.remove('show');
      paintDots(false);
      setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) { } }, 260);
    }

    function open() {
      idx = 0;
      pop.classList.remove('show');
      box.classList.add('show');
      box.setAttribute('aria-hidden', 'false');
      render();
    }

    function close() {
      box.classList.remove('show');
      box.setAttribute('aria-hidden', 'true');
      pop.classList.remove('show');
    }

    function showPop(it, isLast) {
      popEmoji.textContent = it.emoji || '💗';
      popTitle.textContent = `第 ${idx + 1} 题 · 答对啦`;
      popText.textContent = it.pop || '';
      if (it.voice) { voiceLabel.textContent = it.voice; voice.classList.add('show'); }
      else { voice.classList.remove('show'); voiceLabel.textContent = ''; }
      tip.textContent = it.tip || '';
      tip.style.display = it.tip ? '' : 'none';
      next.textContent = isLast ? '都答完啦 ❤' : '下一题';
      pop.classList.add('show');
      setTimeout(() => { try { next.focus({ preventScroll: true }); } catch (e) { } }, 320);
    }

    function submit() {
      if (pop.classList.contains('show')) return;
      const it = Q[idx];
      if (!it) return;
      const v = input.value;
      if (!v.trim()) {
        msg.textContent = '先写下答案，再按提交呀～';
        msg.classList.add('show');
        shake(input);
        return;
      }
      if (isRight(it.answers, v)) {
        const isLast = idx === Q.length - 1;
        paintDots(isLast);
        msg.classList.remove('show');
        showPop(it, isLast);
        if (isLast) Fireworks.celebrate(6);
      } else {
        msg.textContent = '答错了，再想想';
        msg.classList.add('show');
        shake(input);
        try { input.focus({ preventScroll: true }); } catch (e) { }
      }
    }

    $('#fateBtn').addEventListener('click', open);
    $('#fateClose').addEventListener('click', close);
    $('#fateSubmit').addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    next.addEventListener('click', () => {
      const isLast = idx === Q.length - 1;
      pop.classList.remove('show');
      if (isLast) { close(); return; }
      idx++;
      render();
    });
    box.addEventListener('click', e => { if (e.target === box) close(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && box.classList.contains('show')) {
        if (pop.classList.contains('show')) pop.classList.remove('show');

      }

  const endLine = $('#endLine');

  const d = new Date();
  $('#endDate').textContent = CONFIG.dateFull || `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;

  /* 悄悄话：只出现一次 */
  const KEY = 'bday_whisper_seen';
  const seen = localStorage.getItem(KEY);
  $('#whisperBox').textContent = seen ? CONFIG.whispers[1] : CONFIG.whispers[0];
  if (!seen) localStorage.setItem(KEY, '1');

  $('#saveBtn').addEventListener('click', () => {

    const SANS = '"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    const KAI = '"STKaiti","KaiTi","Kaiti SC","楷体","Songti SC",serif';
    const BODY = (CONFIG.finalText || '').replace(/\s+/g, '');
    const SIGN = CONFIG.signature + '，' + CONFIG.yourName;
    const DATE = CONFIG.dateFull || `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    const NO_HEAD = '，。！？；：、）》」』】…—·,.!?;:)]}%';

    /* ---- 1. 奶油底 + 三团柔光 ---- */
    x.fillStyle = '#FFFBF7'; x.fillRect(0, 0, W, H);

      const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r);
      rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = rg; x.fillRect(0, 0, W, H);

    glow(W * .10, -H * .05, W * .92, 'rgba(255,214,228,.90)');
    glow(W * 1.04, H * .06, W * .80, 'rgba(214,234,240,.85)');
    glow(W * .46, H * 1.08, W * .78, 'rgba(217,242,226,.82)');

    /* ---- 2. 极淡小圆点（信纸纹理） ---- */
    for (let i = 0; i < 110; i++) {
      x.fillStyle = 'rgba(255,175,200,' + rand(.05, .15).toFixed(2) + ')';

    cg.addColorStop(0, 'rgba(255,255,255,.96)');
    cg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = cg;
    x.beginPath(); x.arc(W / 2, cakeY - 30, 118, 0, 6.2832); x.fill();
    x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    x.font = '82px ' + SANS;
    x.fillText('🎂', W / 2, cakeY);

    /* ---- 4. HAPPY BIRTHDAY（疏排小字） ---- */
    x.fillStyle = 'rgba(150,110,130,.62)';
    x.font = '600 27px ' + SANS;
    if ('letterSpacing' in x) x.letterSpacing = '7px';

    if ('letterSpacing' in x) x.letterSpacing = '0px';

    c.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `致${CONFIG.herName}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('已下载，在相册/下载里找');
    }, 'image/png');
  });
})();

  document.body.classList.remove('locked');

  const si = Math.max(0, ['s1','s2','s3','s4','s5','s6','s7','s8','s9'].indexOf(id));
  Stage.jump(si);
})();
</script>
